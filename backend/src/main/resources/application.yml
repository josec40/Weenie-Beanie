spring:
  application:
    name: sh-bean
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Tiger Cloud pre-installs extension objects in public; baseline at 0 so V1 still runs.
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        # Bound how long a send can block when Kafka is down (publishing is best-effort).
        max.block.ms: 5000
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
  ai:
    model:
      # Set AI_CHAT_MODEL=none to run without Gemini (deterministic fallbacks are used).
      chat: ${AI_CHAT_MODEL:google-genai}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: 0.2
            thinking-budget: 0

server:
  # 8080 is commonly taken (e.g. local Jenkins); keep in sync with frontend/vite.config.ts.
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 1h
  demo:
    email: ${DEMO_USER_EMAIL:alex@demo.local}
    password: ${DEMO_USER_PASSWORD:}
  ai:
    timeout: PT15S
    cooldown: PT60S

nessie:
  base-url: ${NESSIE_BASE_URL:https://api.nessieisreal.com}
  api-key: ${NESSIE_API_KEY}
